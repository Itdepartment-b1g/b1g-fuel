project_id = "b1g-fuel"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 56324

[edge_runtime]
inspector_port = 56328

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/login"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 8

[auth.email]
# Keep email/password login enabled. [auth].enable_signup still blocks registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
